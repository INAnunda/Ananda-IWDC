<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Architectural Chronicles</title>
    <link rel="stylesheet" href="../Css/Description.css">
    <link rel="icon" type="image/png" href="../IMG/Web-Icon.png">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
</head>
<body>
    <div class="Section-All-Theme" id="theme6">
        
        <header class="Account">
            <div class="UserContianer">
                <a href="#" style="text-decoration: none;" onclick="LogoutProfile()">
                    <img src="../IMG/Profile.png" alt="Profile" class="UserProfileImage" width="200" height="200">
                </a>
                <div class="UserInfo">
                    <h2 class="Username"></h2>
                </div>
            </div>

            <div class="Coin-Key">
                <div id="Key-Display" class="User-Key" onclick="playTakeKeySound()">
                    <img src="../IMG/Key.png" alt="Key Status">
                </div>
                <div id="Coin-Display" class="Group-Coin" onclick="playCoinSound()">
                    <img src="../IMG/Coin.png" alt="Coin Slot">
                    <img src="../IMG/Coin.png" alt="Coin Slot">
                    <img src="../IMG/Coin.png" alt="Coin Slot">
                </div>
            </div>
        </header>

        <main>
            <section class="Section-Theme">
                <div class="Main-Container">

                    <div class="Menu-Wrapper">
                        <div class="music" id="music-toggle" onclick="toggleMusic(), playClickSound()">
                            <img src="../IMG/speaker-icon.png" alt="Toggle Music" id="speaker-icon">
                        </div>
                        <a href="Bag.html" style="text-decoration: none;">
                            <div class="Menu-Bar"><strong>Your Bag</strong></div>
                        </a>
                        <a href="#" style="text-decoration: none;">
                            <div class="Menu-Bar"><strong>Shop</strong></div>
                        </a>
                    </div>

                    <div class="Main-Ticket-Container">
                        <div class="Box-TIcket">

                            <div class="Ticket-Item" id="Ticket1"
                                 onmouseenter="startHoverPickItemSound()"
                                 onmouseleave="stopHoverPickItemSound()"> 
                                <img src="../IMG/Ticket1.png" alt="Ticket 1">
                            </div>

                            <div class="Ticket-Item" id="Ticket2"
                                 onmouseenter="startHoverPickItemSound()"
                                 onmouseleave="stopHoverPickItemSound()">
                                <img src="../IMG/Ticket2.png" alt="Ticket 2">
                            </div>

                            <div class="Ticket-Item" id="Ticket3"
                                 onmouseenter="startHoverPickItemSound()"
                                 onmouseleave="stopHoverPickItemSound()">
                                <img src="../IMG/Ticket3.png" alt="Ticket 3">
                            </div>

                            <div class="Ticket-Item" id="Ticket4"
                                 onmouseenter="startHoverPickItemSound()"
                                 onmouseleave="stopHoverPickItemSound()">
                                <img src="../IMG/Ticket4.png" alt="Ticket 4">
                            </div>

                        </div>
                    </div>

                    <div class="Slider-Helping">
                        <div class="button-wrapper" style="position: relative; z-index: 10;">
                            <button type="button" class="NextButton" style="background-color: #f6101084; color: white; box-shadow: 0 4px 0 #eb242480;" onclick="window.location.href='Main_Theme.html'">
                                <strong>Back</strong>
                            </button>
                        </div>
                    </div>

                </div>
            </section>
        </main>
    </div>

    <script src="../JS/Javascript1.js"></script>
    <script src="../JS/MusicHandler.js"></script>
    <audio id="theme-bg-music" loop></audio>
</body>
</html>
