<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Architectural Chronicles</title>
    <link rel="stylesheet" href="./Css/Login.css">
    <link rel="icon" type="image/png" href="./IMG/Web-Icon.png">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
</head>

<body>
    <main class="Main-Login">

        <section class="box-container">
            <div class="Main-name">
                <h1><strong>Architectural Heritage Records</strong></h1>
                <p>Select your profile.</p>
            </div>
            <div class="choose-profile">
                <div class="profile">
                    <img id="profile1" src="./IMG/profile1.png" alt="">
                    <img id="profile2" src="./IMG/profile2.png" alt="">
                    <img id="profile3" src="./IMG/profile3.png" alt="">
                </div>
            </div>

            <div class="add-name-user" id="user-name">
                <input type="text" placeholder="Name..." maxlength="10">

                <div class="Button-Wrapper">
                    <button type="button" class="button" onclick="SaveAccout()">Submit</button>
                </div>
            </div>
        </section>

        <script src="./JS/Javascript1.js"></script>
        <script src="./JS/Login.js"></script>

    </main>
</body>
</html>
